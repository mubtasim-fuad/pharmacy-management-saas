name: Build and smoke test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DatabasePath: ${{ runner.temp }}/pharmacy-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build API
        run: dotnet build backend/Pharmacy.Api.csproj --configuration Release
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Exercise inventory, purchases, sales and reports
        run: |
          dotnet run --no-build --configuration Release --project backend/Pharmacy.Api.csproj --urls http://127.0.0.1:5075 > /tmp/pharmacy-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true' EXIT
          python3 scripts/smoke_test.py
